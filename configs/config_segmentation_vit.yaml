# Configuration for ISIC segmentation dataset with ViT backbone
# Use this when training ViT-based segmentation models on local image/mask directories

# Global settings
seed: 42

datamodule:
  _target_: src.data.isic_datamodule.ISICSegDataModule

  # Directory-based loading (recommended for segmentation)
  # Provide image_dir and mask_dir pointing to your data
  image_dir: ${oc.env:MR_DATA_ROOT,/scratch/groups/roxanad/datasets}/isic/challenges/2017/ISIC-2017_Training_Data/ISIC-2017_Training_Data  # Directory containing images (e.g., ISIC_0000000.jpg)
  mask_dir: ${oc.env:MR_DATA_ROOT,/scratch/groups/roxanad/datasets}/isic/challenges/2017/ISIC-2017_Test_v2_Part1_GroundTruth/ISIC-2017_Test_v2_Part1_GroundTruth    # Directory containing masks (e.g., ISIC_0000000_segmentation.png)

  # File matching parameters
  image_extension: .jpg              # Extension for image files
  mask_extension: .png               # Extension for mask files
  mask_suffix: _segmentation         # Suffix to append to image name to get mask name
                                     # e.g., if image is "ISIC_0000000.jpg", mask is "ISIC_0000000_segmentation.png"

  # DataLoader parameters
  num_workers: 8
  persistent_workers: false
  prefetch_factor: 2
  pin_memory: true
  drop_last: false
  split_seed: 42


dataset:
  name: null                         # Not used for segmentation
  data_dir: null
  num_workers: 8
  pin_memory: true

data:
  batch_size: 16
  image_size: 224                    # ViT default is 224, can use 384 for vit-base-patch16-384

# Training configuration
train:
  # Core training loop params
  mode: "segmentation"               # Set to "segmentation" for segmentation tasks
  epochs: 50
  grad_clip: 1.0
  mixed_precision: true
  deterministic: false
  log_interval: 50
  metric_key: "val_dice"             # Dice coefficient is common for segmentation

  # Optimizer configuration
  optimizer:
    name: "adamw"
    lr: 1e-4                         # Typical learning rate for segmentation
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1e-8

  # Scheduler configuration
  scheduler:
    name: "cosine"
    epochs: 50
    warmup_epochs: 5                 # Warmup helps with segmentation training
    min_lr: 1e-6

  # Cross-validation params
  k_folds: 5
  subset_frac: 1.0
  seed: 42

  # Hyperparameter search configuration
  # For segmentation, also tune decoder_dropout
  hyperparam_search:
    enabled: false
    use_cv: true
    load_from_file: null
    param_grid:
      lr: [1e-4, 3e-4, 1e-3]
      weight_decay: [0.0, 1e-4, 1e-3]
      batch_size: [8, 16]
      decoder_dropout: [0.0, 0.1, 0.3]  # Segmentation-specific

# Loss configuration
loss:
  # For segmentation, you might use different losses like Dice, Focal, etc.
  # This is just a placeholder - adjust based on your segmentation model
  label_smoothing: 0.0
  ignore_index: -100
  reduction: "mean"

# Logging configuration
logging:
  project: "med-reduce"
  run_name: "vit_segmentation_run"
  wandb_enabled: true
  save_umap_embeddings: false
  umap_max_samples: 15
  save_checkpoints: true

# Distillation configuration
distillation:
  enabled: false

# Runtime configuration
runtime: {}

# Model configuration
model:
  name: "vit_segmentation"           # ViT with segmentation head
  model_id: "google/vit-base-patch16-224"  # Options: google/vit-base-patch16-384, google/vit-large-patch16-224
  type: "vit"
  freeze_backbone: true              # Train only segmentation head (fast, efficient)
  config:
    num_classes: 1                   # Binary segmentation (1 output channel for lesion)
    hidden_size: 768                 # ViT-base hidden size (use 1024 for vit-large)
    patch_size: 16                   # Patch size (matches model_id)
    dropout_rate: 0.1                # Dropout in segmentation head
    loss_type: "dice_bce"            # Combined Dice + BCE loss
    dice_weight: 0.5                 # Weight for Dice loss (0.5 = equal weight)
