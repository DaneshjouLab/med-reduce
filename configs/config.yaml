# Global settings
seed: 42

datamodule:
  _target_: src.data.isic_datamodule.ISICDataModule 
  dataset_name: "MKZuziak/ISIC_2019_224" 
  data_dir: /scratch/users/sonnet/huggingface/datasets
  batch_size: 256
  num_workers: 8
  persistent_workers: false
  prefetch_factor: 2

  filtered_classes: ["0", "1"]  # Strings of class labels
  balance_data: true
  num_train_images: 10000 

dataset:
  # --- Mandatory Fields ---
  name: "MKZuziak/ISIC_2019_224" # The name of the dataset on the Hugging Face Hub (e.g., "cifar10", "glue/cola")
  data_dir: null # Set to null when loading from the Hub; the library handles the path/caching.
  image_size: 224 
  batch_size: 128 
  num_workers: 8

  # --- Optional Fields ---
  pin_memory: True # Speed up data transfer to GPU
  
  # --- Optional Degradation Group ---
  degradation:
    target_resolution: 128 

# Training configuration
train:
  # Core training loop params
  mode: "finetune"
  epochs: 5
  learning_rate: 1e-4
  weight_decay: 0.01
  grad_clip: 1.0
  mixed_precision: true
  deterministic: false
  log_interval: 50
  metric_key: "val_acc"
  scheduler: "cosine"
  
  # Cross-validation params
  k_folds: 2
  subset_frac: 1.0
  seed: 42
  
  # Data ablation params
  proportion_per_transform: 0.2

  hyperparam_search:
    enabled: false
    n_samples: 15
    subset_frac: 0.1
    use_cv: false
    param_grid:
      lr: [1e-5, 1e-4, 5e-4]
      weight_decay: [0.01]
      batch_size: [128]
      label_smoothing: [0.0]
  
# Loss configuration
loss:
  label_smoothing: 0.0
  ignore_index: -100
  reduction: "mean"

# Logging configuration
logging:
  project: "compressed-perception"
  run_name: "dinov3_finetune_run"
  wandb_enabled: true
  save_umap_embeddings: false
  umap_max_samples: 15
  save_checkpoints: true  # Save best model checkpoint from each fold        

# Runtime configuration (will be populated by main())
runtime:
  run_dir: "./runs/finetune"    # Output directory

# --- DINOv3 Model ---
model:
  name: "dinov3"
  model_id: "facebook/dinov3-vits16-pretrain-lvd1689m"
  type: "dinov3"
  config:
    num_labels: 2

