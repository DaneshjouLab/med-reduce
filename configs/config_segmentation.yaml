# Configuration for ISIC segmentation dataset
# Use this when training segmentation models on local image/mask directories

# Global settings
seed: 42

datamodule:
  _target_: src.data.isic_datamodule.ISICSegDataModule

  # Directory-based loading (recommended for segmentation)
  # Provide image_dir and mask_dir pointing to your data
  image_dir: /scratch/groups/roxanad/datasets/isic/challenges/2017/ISIC-2017_Training_Data/ISIC-2017_Training_Data  # Directory containing images (e.g., ISIC_0000000.jpg)
  mask_dir: /scratch/groups/roxanad/datasets/isic/challenges/2017/ISIC-2017_Test_v2_Part1_GroundTruth/ISIC-2017_Test_v2_Part1_GroundTruth    # Directory containing masks (e.g., ISIC_0000000_segmentation.png)

  # File matching parameters
  image_extension: .jpg              # Extension for image files
  mask_extension: .png               # Extension for mask files
  mask_suffix: _segmentation         # Suffix to append to image name to get mask name
                                     # e.g., if image is "ISIC_0000000.jpg", mask is "ISIC_0000000_segmentation.png"

  # DataLoader parameters
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
  drop_last: false
  split_seed: 42


dataset:
  name: null                         # Not used for segmentation
  data_dir: null
  num_workers: 8
  pin_memory: true

data:
  batch_size: 16
  image_size: 256

# Training configuration
train:
  # Core training loop params
  mode: "segmentation"
  k_folds: 2               # Set to "segmentation" for segmentation tasks
  epochs: 50
  grad_clip: 1.0
  mixed_precision: true
  deterministic: false
  log_interval: 50
  metric_key: "val_dice"             # Dice coefficient is common for segmentation

  # Optimizer configuration
  optimizer:
    name: "adamw"
    lr: 1e-4                         # Typical learning rate for segmentation
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1e-8

  # Scheduler configuration
  scheduler:
    name: "cosine"
    epochs: 50
    warmup_epochs: 5                 # Warmup helps with segmentation training
    min_lr: 1e-6

  # Train/val split params
  val_frac: 0.2
  subset_frac: 1.0
  seed: 42

  # Hyperparameter search configuration
  # For segmentation, also tune decoder_dropout
  hyperparam_search:
    enabled: false
    use_cv: false
    load_from_file: null
    param_grid:
      lr: [1e-4, 3e-4]
      weight_decay: [0.0, 1e-4]
      batch_size: [8]
      decoder_dropout: [0.0, 0.1]  # Segmentation-specific

# Loss configuration
loss:
  # For segmentation, you might use different losses like Dice, Focal, etc.
  # This is just a placeholder - adjust based on your segmentation model
  label_smoothing: 0.0
  ignore_index: -100
  reduction: "mean"

# Logging configuration
logging:
  project: "reduced-perception"
  run_name: "segmentation_run"
  wandb_enabled: true
  save_umap_embeddings: false
  umap_max_samples: 15
  save_checkpoints: true

# Distillation configuration
distillation:
  enabled: false

# Runtime configuration
runtime: {}

# Model configuration
model:
  name: "dinov3_segmentation"        # DINOv3 with segmentation head
  model_id: "facebook/dinov3-vits16-pretrain-lvd1689m"
  type: "dinov3_segmentation"
  freeze_backbone: true              # Train only segmentation head (fast, efficient)
  config:
    num_classes: 1                   # Binary segmentation (1 output channel for lesion)
    hidden_size: 384                 # DINOv3 small hidden size
    dropout_rate: 0.1                # Dropout in segmentation head
    loss_type: "dice_bce"            # Combined Dice + BCE loss
    dice_weight: 0.5                 # Weight for Dice loss (0.5 = equal weight)
