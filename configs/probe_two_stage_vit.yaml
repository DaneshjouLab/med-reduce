# Two-Stage Linear Probing Configuration - ViT
#
# Pipeline:
# (A) Data loading & split definition - consistent splits across all experiments
# (B) Image preprocessing - clean images at target resolution
# (C) Frozen ViT encoder - extract and cache embeddings
# (D) Linear Probing - two-stage process
#     D1: Hyperparameter tuning at full resolution R* (5-fold CV)
#     D2: Final training at each resolution R with fixed hyperparameters

# Runtime configuration
runtime: {}

domain: "dermatology"  # Options (eventually): dermatology, radiology, pathology

# Split configuration
split_dir: /scratch/groups/roxanad/users/sonnet/compressed_perception/splits

# Embedding cache configuration
embedding_cache_dir: /scratch/groups/roxanad/users/sonnet/compressed_perception/cache/embeddings

datamodule:
  _target_: src.data.isic_datamodule_persistent.ISICDataModulePersistent
  dataset_name: null  # Set to null for local data
  data_dir: /scratch/groups/roxanad/datasets/isic/challenges/2017/merged_isic_2017_data/images
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  split_dir: /scratch/groups/roxanad/users/sonnet/compressed_perception/splits
  use_val_split: false  # Use train/test splits, create val from train
  train_ratio: 0.8

  # Local dataset configuration
  local_label_file: /scratch/groups/roxanad/datasets/isic/challenges/2017/merged_isic_2017_data/merged_ground_truth_part3.csv
  local_image_id_column: image_id
  local_label_column: melanoma
  local_image_extension: .jpg

  filtered_classes: ["0.0", "1.0"]
  balance_data: false
  num_train_images: 10000

  force_recompute_embeddings: false

data:
  image_size: 512
  batch_size: 256

model:
  name: "vit"
  model_id: "google/vit-base-patch16-224"  # Options: google/vit-base-patch16-384, google/vit-large-patch16-224
  type: "vit"
  config:
    num_labels: 2
    ignore_mismatched_sizes: true

train:
  epochs: 100
  seed: 42
  k_folds: 5
  mixed_precision: true
  grad_clip: null
  log_interval: 50
  metric_key: "val_auroc"

  optimizer:
    type: "adamw"
    lr: 1e-3
    weight_decay: 1e-4
    betas: [0.9, 0.999]

  scheduler:
    type: "cosine"
    warmup_epochs: 10
    min_lr: 1e-6

  hyperparam_search:
    enabled: true  # Set to true for hyperparameter tuning at highest resolution
    use_cv: true

    # Grid search parameters
    param_grid:
      lr: [1e-4, 3e-4, 1e-3]
      weight_decay: [0, 1e-4, 1e-3]
      batch_size: [32, 64]

    load_from_file: "/scratch/groups/roxanad/users/sonnet/compressed_perception/runs/probe_two_stage_vit/hyperparam_search/best_hyperparameters.json"

loss:
  label_smoothing: 0.0
  ignore_index: -100
  reduction: "mean"

logging:
  project: "two-stage-linear-probe"
  run_name: "vit_isic_512px"
  wandb_enabled: true
  save_checkpoints: true
