# Distillation Pipeline Configuration — Radiology (CheXpert)
#
# Pipeline:
#   1. Cache teacher (DINOv3) embeddings at 512px on train split
#   2. Train student (ResNet18/TinyViT) end-to-end on degraded images
#      to match teacher embeddings
#   3. Save distilled student checkpoint
#
# Usage:
#   python -m src.cli.run_distillation --config-name=distillation_radiology

# Runtime configuration
runtime:
  run_dir: /scratch/users/bikia/reduced-perception-rad-results/runs/distillation

domain: "radiology"

# Split configuration (same as LP baseline for consistency)
split_dir: /scratch/users/bikia/reduced-perception-rad-results/splits

# Teacher model (frozen, used only for embedding extraction)
teacher:
  name: "dinov3"
  model_id: "facebook/dinov3-vits16-pretrain-lvd1689m"
  type: "dinov3"
  config:
    num_labels: 13
    hidden_size: 384

# Student model (trained end-to-end)
student:
  name: "resnet18"
  model_id: "resnet18"
  type: "timm"
  config:
    num_labels: 13
    pretrained: true

# Distillation settings
distillation:
  alpha: 0.5               # MSE vs cosine balance (1.0 = pure MSE, 0.0 = pure cosine)
  teacher_resolution: 512   # Resolution for teacher embedding extraction
  teacher_cache_dir: /scratch/users/bikia/reduced-perception-rad-results/cache/teacher_embeddings
  lp_embedding_cache_dir: /scratch/users/bikia/reduced-perception-rad-results/cache/embeddings

# Dataset configuration (mirrors probe_two_stage_radiology.yaml)
datamodule:
  _target_: src.data.tabular_datamodule_persistent.TabularDataModulePersistent
  dataset_name: null
  data_dir: /scratch/groups/roxanad/datasets/chexpert/combined_train_valid_chexpert_v1.0
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  split_dir: /scratch/users/bikia/reduced-perception-rad-results/splits
  use_val_split: false
  train_ratio: 0.8

  # Local dataset configuration
  local_label_file: /scratch/groups/roxanad/datasets/chexpert/explore_chexpert/train_valid_combined.csv
  local_image_id_column: image_id
  local_label_column: [
    "Enlarged Cardiomediastinum",
    "Cardiomegaly",
    "Lung Opacity",
    "Lung Lesion",
    "Edema",
    "Consolidation",
    "Pneumonia",
    "Atelectasis",
    "Pneumothorax",
    "Pleural Effusion",
    "Pleural Other",
    "Fracture",
    "Support Devices",
  ]
  local_image_extension: .jpg

  # Dataset filtering
  filtered_classes: null
  balance_data: false
  num_train_images: 10000

  force_recompute_embeddings: false

data:
  multi_label: true
  image_size: 512
  batch_size: 32

train:
  epochs: 100
  seed: 42
  mixed_precision: true
  grad_clip: null
  log_interval: 50

  optimizer:
    name: "adamw"
    lr: 1e-4
    weight_decay: 1e-4
    betas: [0.9, 0.999]

  scheduler:
    name: "cosine"
    warmup_epochs: 5
    min_lr: 1e-6

logging:
  project: "reduced-perception"
  wandb_enabled: true
  run_name: "distillation_radiology_resnet18"
