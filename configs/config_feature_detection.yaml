# Configuration for ISIC dermoscopic feature detection dataset
# Use this when training models for multi-label superpixel feature classification

# Global settings
seed: 42

datamodule:
  _target_: src.data.isic_datamodule.ISICFeatureDataModule

  # Directory-based loading (three directories required)
  image_dir: /scratch/groups/roxanad/datasets/isic/challenges/2017/ISIC-2017_Training_Data/ISIC-2017_Training_Data/            # Directory containing images (e.g., ISIC_0000000.jpg)
  superpixel_dir: /scratch/groups/roxanad/datasets/isic/challenges/2017/ISIC-2017_Training_Data/ISIC-2017_Training_Data/    # Directory containing superpixel masks (e.g., ISIC_0000000_superpixels.png)
  annotation_dir: /scratch/groups/roxanad/datasets/isic/challenges/2017/ISIC-2017_Training_Part2_GroundTruth/ISIC-2017_Training_Part2_GroundTruth    # Directory containing JSON annotations (e.g., ISIC_0000000.json)

  # File matching parameters
  image_extension: .jpg                         # Extension for image files
  superpixel_extension: .png                    # Extension for superpixel mask files
  annotation_extension: .json                   # Extension for annotation files
  superpixel_suffix: _superpixels               # Suffix to append to image name to get superpixel filename
                                                # e.g., if image is "ISIC_0000000.jpg",
                                                # superpixel is "ISIC_0000000_superpixels.png"

  # DataLoader parameters
  num_workers: 8
  persistent_workers: false
  prefetch_factor: 2
  pin_memory: true
  drop_last: false
  split_seed: 42


dataset:
  name: null                                    # Not used for feature detection
  data_dir: null
  num_workers: 8
  pin_memory: true

# Data configuration
data:
  batch_size: 8                                 # Small batch size (feature detection is memory intensive)
  image_size: 256

# Training configuration
train:
  # Core training loop params
  mode: "feature_detection"                     # Set to "feature_detection" for this task
  epochs: 100                                   # Feature detection may need more epochs
  grad_clip: 1.0
  mixed_precision: true
  deterministic: false
  log_interval: 50
  metric_key: "val_f1"                          # F1 score is common for multi-label tasks

  # Optimizer configuration
  optimizer:
    name: "adamw"
    lr: 1e-4                                    # Typical learning rate
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1e-8

  # Scheduler configuration
  scheduler:
    name: "cosine"
    epochs: 100
    warmup_epochs: 10                           # Warmup helps with multi-label tasks
    min_lr: 1e-6

  # Cross-validation params
  k_folds: 5
  subset_frac: 1.0
  seed: 42

  # Hyperparameter search configuration
  hyperparam_search:
    enabled: false
    use_cv: true
    load_from_file: null
    param_grid:
      lr: [1e-4, 3e-4, 1e-3]
      weight_decay: [0.0, 1e-4, 1e-3]
      batch_size: [4, 8, 16]
      # Feature detection specific
      pos_weight: [1.0, 2.0, 5.0]              # Weight for positive class (handle class imbalance)

# Loss configuration
loss:
  # For multi-label classification, use BCEWithLogitsLoss
  # This is just a placeholder - adjust based on your model
  label_smoothing: 0.0
  ignore_index: -100
  reduction: "mean"
  # Feature-specific: you might want to use weighted BCE loss
  # to handle class imbalance in dermoscopic features

# Logging configuration
logging:
  project: "compressed-perception"
  run_name: "feature_detection_run"
  wandb_enabled: true
  save_umap_embeddings: false
  umap_max_samples: 15
  save_checkpoints: true

# Distillation configuration
distillation:
  enabled: false

# Runtime configuration
runtime: {}

# Model configuration
# This is a placeholder - configure based on your feature detection model
model:
  name: "feature_detector"                      # Your custom feature detection model
  # Add your model configuration here
  config:
    num_features: 4                             # Four dermoscopic features to detect
    image_size: 256
    # Model should output per-superpixel predictions
    # Architecture suggestions:
    # - CNN backbone (e.g., ResNet, DINOv2) to extract features
    # - Superpixel pooling layer to aggregate pixel features per superpixel
    # - Multi-label classification head (4 binary classifiers)

# Feature names (for reference)
# The four dermoscopic features annotated in the dataset:
# 1. "network" - Pigment Network
# 2. "negative network" - Negative Network
# 3. "streaks" - Streaks
# 4. "milia-like cysts" - Milia-like Cysts
#
# Each feature has binary labels (0 or 1) for each superpixel in the image.
# Model output should be probabilities [0.0, 1.0] for each feature per superpixel.
