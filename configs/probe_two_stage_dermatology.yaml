# Two-Stage Linear Probing Configuration
#
# Pipeline:
# (A) Data loading & split definition - consistent splits across all experiments
# (B) Image preprocessing - clean images at target resolution
# (C) Frozen DINOv3 encoder - extract and cache embeddings
# (D) Linear Probing - two-stage process
#     D1: Hyperparameter tuning at full resolution R* (5-fold CV)
#     D2: Final training at each resolution R with fixed hyperparameters

# Runtime configuration
runtime:
  run_dir: ${oc.env:MR_RESULTS_ROOT,/scratch/users/bikia/med-reduce-derm-results}/runs/probe_two_stage

domain: "dermatology"  # Options: dermatology, radiology, pathology

# Split configuration
split_dir: ${oc.env:MR_RESULTS_ROOT,/scratch/users/bikia/med-reduce-derm-results}/splits

# Embedding cache configuration
embedding_cache_dir: ${oc.env:MR_RESULTS_ROOT,/scratch/users/bikia/med-reduce-derm-results}/cache/embeddings

# Domain-specific dataset configuration

datamodule:
  _target_: src.data.tabular_datamodule_persistent.TabularDataModulePersistent
  dataset_name: null  # Set to null for local data
  data_dir: ${oc.env:MR_DATA_ROOT,/scratch/groups/roxanad/datasets}/isic/challenges/2017/merged_isic_2017_data/images  # <----- Where images live
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  split_dir: ${oc.env:MR_RESULTS_ROOT,/scratch/users/bikia/med-reduce-derm-results}/splits
  use_val_split: false  # Use train/test splits, create val from train
  train_ratio: 0.8

  # Local dataset configuration (domain-specific)
  local_label_file: ${oc.env:MR_DATA_ROOT,/scratch/groups/roxanad/datasets}/isic/challenges/2017/merged_isic_2017_data/merged_ground_truth_part3.csv # <----- Where labels live
  local_image_id_column: image_id # Update for radiology/pathology from labels.csv
  local_label_column: ["melanoma", "seborrheic_keratosis"]  # <------- Update for radiology/pathology
  local_image_extension: .jpg

  # Dataset filtering (domain-specific)
  filtered_classes: null
  # Specifies which classes to keep from the dataset. When null, no class filtering is applied — all classes in the dataset are used. If set to a list (e.g.,
  # ["melanoma", "benign"]) only samples belonging to those classes are retained for training and evaluation.
  balance_data: false  # Controls whether to equalize class counts. Since this is false, no balancing happens — the dataset is used as-is with its natural class distribution. When
   #true, it triggers balance_dataset() which subsamples the majority classes so each class has the same number of samples.
  num_train_images: 10000  # The total budget of training images when balancing is active. It's divided equally across classes.

  force_recompute_embeddings: true

data:
  image_size: 512  # Resolution R for this experiment (degradation level)
  native_resolution: 512  # Model input always this size; image_size controls degradation
  batch_size: 256

model:
  name: "dinov3"
  model_id: "facebook/dinov3-vits16-pretrain-lvd1689m"
  type: "dinov3"
  config:
    num_labels: 3  # Update for radiology/pathology (ISIC: 3 classes)
    hidden_size: 384
    dropout_rate: 0.1

train:
  epochs: 200
  seed: 42
  k_folds: 5
  mixed_precision: true
  grad_clip: null
  log_interval: 50
  metric_key: "val_auroc"

  optimizer:
    type: "adamw"
    lr: 1e-3
    weight_decay: 1e-4
    betas: [0.9, 0.999]

  scheduler:
    type: "cosine"
    warmup_epochs: 10
    min_lr: 1e-6

  hyperparam_search:
    enabled: true  # Set to true for hyperparameter tuning at highest resolution
    use_cv: true

    # Grid search parameters
    param_grid:
      lr: [1e-4, 3e-4, 1e-3]
      weight_decay: [0, 1e-4, 1e-3]
      batch_size: [32, 64]
      # Uncomment for segmentation tasks:
      # decoder_dropout: [0.0, 0.1, 0.3]

    load_from_file: null  # Auto-resolved from run_dir/seed_{seed}/hyperparam_search/{dataset}_{model}/

loss:
  label_smoothing: 0.0
  ignore_index: -100
  reduction: "mean"

logging:
  project: "med-reduce" # <----- Update for your W&B project name
  run_name: "dinov3_dermatology_512px"
  wandb_enabled: true
  save_checkpoints: true
