# Example configuration showing how to specify teacher metrics
# for AET (Accuracy-Efficiency Trade-off) score calculation

# Model configuration
model:
  type: "dinov2"
  model_id: "facebook/dinov2-small"
  config:
    num_labels: 8

# Dataset configuration
data:
  dataset_name: "isic2019"
  data_dir: "${oc.env:DATA_DIR,./data}"
  image_size: 224
  batch_size: 32
  num_workers: 4

# Datamodule configuration
datamodule:
  _target_: src.data.isic_datamodule.ISICDataModule
  data_dir: "${data.data_dir}"
  image_size: ${data.image_size}
  batch_size: ${data.batch_size}
  num_workers: ${data.num_workers}

# Training configuration
train:
  epochs: 10
  grad_clip: 1.0
  mixed_precision: true
  log_interval: 50
  metric_key: "val_acc"

  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-4
    weight_decay: 0.01

  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: ${train.epochs}
    eta_min: 1e-6

# Loss configuration
loss:
  label_smoothing: 0.1
  ignore_index: -100
  reduction: "mean"

# Logging configuration
logging:
  project: "resolution-aware-probe"
  run_name: "dinov2_small_224px"
  wandb_enabled: true
  entity: null
  tags:
    - "probe"
    - "dinov2"
    - "resolution_study"

# Runtime configuration
runtime:
  run_dir: "./runs/probe_dinov2_small_224"

# ============================================================================
# TEACHER METRICS FOR AET CALCULATION
# ============================================================================
# These metrics are used to compute the Accuracy-Efficiency Trade-off (AET) score.
# The AET score is defined as:
#
#   AET = (Model_Accuracy / Teacher_Accuracy) / (Model_Compute / Teacher_Compute)
#
# where Composite_Compute = FLOPs × Latency × Memory
#
# An AET > 1 means the model is more efficient than the teacher.
#
# To obtain these metrics for your teacher model:
# 1. Run the teacher model through the same pipeline
# 2. Record the metrics from the output
# 3. Add them here for all subsequent student/compressed model runs

metrics:
  # Teacher model identifier
  teacher_model: "facebook/dinov2-large"

  # Teacher accuracy (Top-1 accuracy on validation set, as percentage)
  teacher_accuracy: 85.4

  # Teacher computational metrics (on same hardware!)
  teacher_flops: 77.5          # GFLOPs for single forward pass
  teacher_latency: 15.2        # milliseconds per image
  teacher_memory: 2048         # MB peak GPU memory during inference

  # Optional: if you already computed composite, you can provide it directly
  # teacher_composite_compute: 2,416,640  # FLOPs × latency × memory
  # Otherwise it will be computed automatically

# ============================================================================
# NOTES ON TEACHER METRICS
# ============================================================================
#
# 1. CONSISTENCY: Always measure teacher metrics on the SAME hardware as student
#    models for fair comparison. GPU type, driver version, and batch size all
#    affect latency and memory measurements.
#
# 2. ACCURACY: Use the same validation split and preprocessing for teacher
#    accuracy measurement. Do not use reported numbers from papers if possible.
#
# 3. PROFILING: Use the training_utils functions for consistent measurement:
#    - profile_model() for FLOPs
#    - calculate_inference_latency() for latency
#    - get_gpu_memory() for memory
#
# 4. RESOLUTION: If comparing models at different resolutions, you may want
#    separate teacher metrics for each resolution. In that case, create
#    separate config files or use Hydra overrides.
#
# 5. MULTIPLE TEACHERS: For comparing against multiple baselines, you can
#    run the analysis multiple times with different teacher configs, or
#    manually add metrics afterward via the MetricsCollector API.
#
# Example usage:
#   python src/cli/train.py --config-name example_with_teacher_metrics
