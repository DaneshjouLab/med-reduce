# Two-Stage Linear Probing Configuration
#
# Pipeline:
# (A) Data loading & split definition - consistent splits across all experiments
# (B) Image preprocessing - clean images at target resolution
# (C) Frozen DINOv3 encoder - extract and cache embeddings
# (D) Linear Probing - two-stage process
#     D1: Hyperparameter tuning at full resolution R* (5-fold CV)
#     D2: Final training at each resolution R with fixed hyperparameters

# Runtime configuration
runtime:
  run_dir: /scratch/groups/roxanad/users/sonnet/compressed_perception/runs/probe_two_stage

domain: "dermatology"  # Options: dermatology, radiology, pathology

# Split configuration
split_dir: /scratch/groups/roxanad/users/sonnet/compressed_perception/splits

# Embedding cache configuration
embedding_cache_dir: /scratch/groups/roxanad/users/sonnet/compressed_perception/cache/embeddings

# Domain-specific dataset configuration
# dermatology: ISIC dataset
# radiology: ${RADIOLOGY_DATASET_PATH}
# pathology: ${PATHOLOGY_DATASET_PATH}

datamodule:
  _target_: src.data.isic_datamodule_persistent.ISICDataModulePersistent
  dataset_name: null  # Set to null for local data
  data_dir: /scratch/groups/roxanad/datasets/isic/challenges/2017/merged_isic_2017_data/images  # Update for radiology/pathology
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  split_dir: /scratch/groups/roxanad/users/sonnet/compressed_perception/splits
  use_val_split: false  # Use train/test splits, create val from train
  train_ratio: 0.8

  # Local dataset configuration (domain-specific)
  local_label_file: /scratch/groups/roxanad/datasets/isic/challenges/2017/merged_isic_2017_data/merged_ground_truth_part3.csv  # Update for radiology/pathology
  local_image_id_column: image_id
  local_label_column: ["nevus", "melanoma", "seborrheic_keratosis"]  # Update for radiology/pathology
  local_image_extension: .jpg

  # Dataset filtering (domain-specific)
  filtered_classes: null
  balance_data: false
  num_train_images: 10000  # Update for radiology/pathology

  force_recompute_embeddings: true

data:
  image_size: 512  # Resolution R for this experiment
  batch_size: 256

model:
  name: "dinov3"
  model_id: "facebook/dinov3-vits16-pretrain-lvd1689m"
  type: "dinov3"
  config:
    num_labels: 3  # Update for radiology/pathology (ISIC: 3 classes)
    hidden_size: 384
    dropout_rate: 0.1

train:
  epochs: 100
  seed: 42
  k_folds: 5
  mixed_precision: true
  grad_clip: null
  log_interval: 50
  metric_key: "val_auroc"

  optimizer:
    type: "adamw"
    lr: 1e-3
    weight_decay: 1e-4
    betas: [0.9, 0.999]

  scheduler:
    type: "cosine"
    warmup_epochs: 10
    min_lr: 1e-6

  hyperparam_search:
    enabled: true  # Set to true for hyperparameter tuning at highest resolution
    use_cv: true

    # Grid search parameters
    param_grid:
      lr: [1e-4, 3e-4, 1e-3]
      weight_decay: [0, 1e-4, 1e-3]
      batch_size: [32, 64]
      # Uncomment for segmentation tasks:
      # decoder_dropout: [0.0, 0.1, 0.3]

    load_from_file: "/scratch/groups/roxanad/users/sonnet/compressed_perception/runs/probe_two_stage/hyperparam_search/best_hyperparameters.json"

loss:
  label_smoothing: 0.0
  ignore_index: -100
  reduction: "mean"

logging:
  project: "reduced-perception"
  run_name: "dinov3_isic_512px"
  wandb_enabled: true
  save_checkpoints: true
