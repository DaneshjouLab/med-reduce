# Two-Stage Linear Probing Configuration
#
# Pipeline:
# (A) Data loading & split definition - consistent splits across all experiments
# (B) Image preprocessing - clean images at target resolution
# (C) Frozen DINOv3 encoder - extract and cache embeddings
# (D) Linear Probing - two-stage process
#     D1: Hyperparameter tuning at full resolution R* (5-fold CV)
#     D2: Final training at each resolution R with fixed hyperparameters

# Runtime configuration
runtime:
  run_dir: /scratch/groups/roxanad/users/sonnet/compressed_perception/runs/probe_two_stage

domain: "dermatology"  # Options (eventually): dermatology, radiology, pathology

# Split configuration
split_dir: /scratch/groups/roxanad/users/sonnet/compressed_perception/splits

# Embedding cache configuration
embedding_cache_dir: /scratch/groups/roxanad/users/sonnet/compressed_perception/cache/embeddings

datamodule:
  _target_: src.data.datamodule.BaseDataModule
  dataset_name: "isic"
  data_dir: /scratch/groups/roxanad/users/sonnet/compressed_perception/data/isic
  batch_size: 256
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2

data:
  image_size: 512  # Resolution R for this experiment
  batch_size: 256

model:
  name: "dinov3"
  model_id: "facebook/dinov3-vits16-pretrain-lvd1689m"
  type: "dinov3"
  config:
    num_labels: 2
    hidden_size: 384
    dropout_rate: 0.1

train:
  epochs: 100
  seed: 42
  k_folds: 5
  mixed_precision: true
  grad_clip: null
  log_interval: 50
  metric_key: "val_acc"

  optimizer:
    type: "adamw"
    lr: 1e-3
    weight_decay: 1e-4
    betas: [0.9, 0.999]

  scheduler:
    type: "cosine"
    warmup_epochs: 10
    min_lr: 1e-6

  hyperparam_search:
    enabled: false  # Set to true for hyperparameter tuning at highest resolution
    use_cv: true

    # Grid search parameters
    param_grid:
      lr: [1e-4, 3e-4, 1e-3]
      weight_decay: [0, 1e-4, 1e-3]
      batch_size: [32, 64]
      # Uncomment for segmentation tasks:
      # decoder_dropout: [0.0, 0.1, 0.3]

    # Optional: Load pre-tuned hyperparameters from high-resolution search
    # load_from_file: "./runs/probe_two_stage/hyperparam_search/best_hyperparameters.json"

loss:
  label_smoothing: 0.0
  ignore_index: -100
  reduction: "mean"

logging:
  project: "two-stage-linear-probe"
  run_name: "dinov3_isic_512px"
  wandb_enabled: true
  save_checkpoints: true
