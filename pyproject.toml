[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reduced-perception"
version = "0.1.0"
description = "REDUCE: Resolution-Aware Evaluation of Deep Understanding and Computational Efficiency"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "DaneshjouLab", email = "daneshjoulab@stanford.edu"},
]
keywords = ["vision", "efficiency", "multi-resolution", "linear-probing", "distillation"]

dependencies = [
    # Core ML
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.30",
    "accelerate>=0.20",
    "timm>=0.9",
    "datasets>=2.14",

    # Scientific computing
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",

    # Visualization
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "umap-learn>=0.5",

    # Config & logging
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.15",
    "loguru>=0.7",
    "tqdm>=4.65",

    # Utilities
    "pillow>=9.5",
    "python-dotenv>=1.0",
    "pynvml>=11.5",
    "thop>=0.1",
    "requests>=2.31",
    "ipykernel",
    "openslide-python>=1.4.3",
    "openslide-bin>=4.0.0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "isort>=5.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/DaneshjouLab/reduced-perception"
Repository = "https://github.com/DaneshjouLab/reduced-perception.git"
Issues = "https://github.com/DaneshjouLab/reduced-perception/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/cli/*",
    "src/data/*",
    "src/wrappers/*",
    "src/engines/*",
    "src/evaluation/*",
    "src/models/dinov3.py",
    "src/models/dinov3_feature_detection.py",
    "src/models/dinov3_segmentation.py",
    "src/models/vit_segmentation.py",
    "src/transformations/*",
    "src/utils/callbacks_hf.py",
    "src/utils/split_manager.py",
    "src/utils/teacher_cache.py",
    "src/utils/logging_core.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
